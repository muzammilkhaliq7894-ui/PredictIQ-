[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Phase 1 exploratory data analysis for predictive maintenance datasets"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["httpx>=0.24", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
